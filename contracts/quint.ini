# pytest configuration for the Quint contracts only, used with -c:
#   pytest -c contracts/quint.ini contracts --quint-require-complete
# The main suite never loads it. The repository root comes first on the path, so the
# checkout's pyrsistent is under test even when tox has installed a copy.
[pytest]
pythonpath = .. pmap_evolver
quint_required_contracts = pmap-evolver
