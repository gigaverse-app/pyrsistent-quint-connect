name: tests

on:
  - push
  - pull_request

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox tox-gh-actions
    - name: Test with tox
      run: tox

  coverage:
    runs-on: ubuntu-latest
    needs: tests
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox
    - name: Test with tox
      run: tox -e coverage-py313
    - name: Upload coverage to Coveralls
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path-to-lcov: tests/coverage.xml

  contracts:
    name: Quint contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # the report's pull request comment
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    # Any Node.js 22+. pytest-quint-connect installs Quint 0.33.1 with npm on first use.
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
    # Where the plugin keeps its Quint between runs; tox.ini pins pytest-quint-connect.
    - uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/quint-cache
        key: quint-${{ runner.os }}-${{ hashFiles('tox.ini') }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox
    - name: Check the driver base and replay the model's histories against the code
      env:
        PYTEST_QUINT_CONNECT_CACHE: ${{ runner.temp }}/quint-cache
      run: tox -e contracts
    # Comments on the pull request, uploads the receipts and checks the README block.
    - uses: gigaverse-app/pytest-quint-connect/report@v1
      if: ${{ !cancelled() }}
      with:
        readme: contracts/README.md
